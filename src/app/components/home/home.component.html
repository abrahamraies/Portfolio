<section id="home" class="d-flex flex-column justify-content-center align-items-center">
  <div class="home-container" data-aos="fade-in" style="display: inline-block;">
    <h1 class="name-title">Abraham Raies</h1>
    <div class="hero-role">{{ roleLabel }}</div>

    <div class="hero-typed">
      <ngx-typed-js
        [strings]="typedStrings"
        [backDelay]="1800"
        [loop]="true"
        [backSpeed]="50"
        [typeSpeed]="50"
        [showCursor]="false">

        <span class="subtitle-typing">{{ introLabel }}</span>
        <span class="typing subtitle-typing"></span>

      </ngx-typed-js>
    </div>

    <div class="hero-actions">
      <a class="hero-btn hero-btn-primary scrollto" href="#contact">{{ contactLabel }}</a>
      <a class="hero-btn hero-btn-secondary" [href]="cvUrl" target="_blank" rel="noopener">{{ cvLabel }}</a>
      <a class="hero-link scrollto" href="#proyect">{{ projectsLabel }}</a>
    </div>
  </div>
</section>
