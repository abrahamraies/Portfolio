<section class="what-i-do-container">
  <h1>{{ t.title }}</h1>
  <p class="subheading">{{ t.subtitle }}</p>

  <h2>{{ t.servicesTitle || '¿Qué puedo hacer por vos?' }}</h2>
  <ul class="services">
    <li *ngFor="let service of t.services">✔️ {{ service }}</li>
  </ul>

  <h2>{{ t.results }}</h2>
  <div class="projects">
    <div class="project-card" *ngFor="let project of t.projects">
      <img [src]="project.img" [alt]="project.title" />
      <div class="project-content">
        <h3>{{ project.title }}</h3>
        <p>{{ project.desc }}</p>
        <a [href]="project.link" target="_blank" class="project-btn">
          🔗 {{ isSpanish ? 'Ver Página' : 'View Live' }}
        </a>
      </div>
    </div>
  </div>

  <h2>{{ t.stepsTitle }}</h2>
  <ol class="steps">
    <li *ngFor="let step of t.steps; let i = index">
      <strong>{{ i + 1 }}.</strong> {{ step }}
    </li>
  </ol>

  <div class="cta">
    <h2>{{ t.cta }}</h2>
    <button (click)="goToContact()" class="cta-btn">{{ t.ctaBtn }}</button>
  </div>
</section>
